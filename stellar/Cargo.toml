[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
soroban-sdk = "26.0.0"
soroban-client = "0.5.6"
stellar-strkey = "0.0.16"

ibc = "0.57"
ibc-proto = "0.51"
ibc-primitives = "0.57"

tonic = "0.14.6"
tonic-build = "0.14"
prost = "0.14.3"

async-trait = "0.1.89"
tokio = { version = "1.52.3", features = ["time", "rt-multi-thread", "macros", "sync"] }
axum = "0.8.9"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

sha2 = "0.10"
sha3 = "0.11.0"
hex = "0.4"

chrono = "0.4.44"
regex = "1.12.3"
thiserror = "1"
anyhow = "1"
config = "0.14"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.contracts]
inherits = "release"
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release]
overflow-checks = true